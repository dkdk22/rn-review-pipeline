name: RN Multiagent Review (reusable)

on:
  workflow_call:
    inputs:
      pipeline_ref:
        description: "Git ref of dkdk22/rn-review-pipeline to use for agents/prompt"
        type: string
        default: main
      node_version:
        type: string
        default: "20"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: read
  statuses: write

jobs:
  rn-review:
    # Branch protection should require the "rn-review-pipeline" commit
    # status (posted by the "Report commit status for current HEAD" step
    # below), not this job's own check-suite name — the job's check is tied
    # to whatever SHA was checked out when it started, but when this job
    # pushes a new commit, that new SHA is what actually becomes the PR's
    # head, and nothing guarantees a fresh workflow run fires for it. The
    # commit status is posted explicitly for HEAD at the end of this run,
    # so it always covers the real final SHA — pushed or not.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Checkout rn-review-pipeline (agents & prompt)
        uses: actions/checkout@v4
        with:
          repository: dkdk22/rn-review-pipeline
          ref: ${{ inputs.pipeline_ref }}
          path: .rn-pipeline

      # Loop-safety guarantee #1 (model-independent, checked before anything
      # else runs): a hard ceiling on how many times this workflow may fire
      # for a single PR within a short recent window. Windowed, not
      # lifetime — a PR legitimately reviewed several times over hours or
      # days must never get permanently stuck; a runaway loop firing many
      # times in minutes is what this actually catches.
      - name: Circuit breaker — cap runs per PR in a short window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${{ github.repository }}/actions/runs?event=pull_request&per_page=100" \
            --jq "[.workflow_runs[] | select(.pull_requests[]?.number == ${{ github.event.pull_request.number }}) | select((now - (.created_at | fromdateiso8601)) < 900)] | length")
          echo "Runs seen for PR #${{ github.event.pull_request.number }} in the last 15 minutes: $count"
          if [ "$count" -gt 8 ]; then
            echo "::error::Circuit breaker tripped: more than 8 rn-review runs in the last 15 minutes for this PR. Stopping before running any agent, to avoid a runaway loop — a human should investigate."
            exit 1
          fi

      # Loop-safety guarantee #2: has the pipeline already pushed a commit
      # on this PR? If so, this run only verifies — it may not push again,
      # enforced below by an `if:` on the commit/push step itself (not by
      # asking the agent nicely).
      - name: Check for prior pipeline commit
        id: prior_commit
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          if git log "origin/${{ github.event.pull_request.base.ref }}..HEAD" \
              --author="rn-review-pipeline@users.noreply.github.com" --oneline | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Installed at user scope (~/.claude/agents), not the repo's own
      # .claude/ — claude-code-action treats the checked-out PR head's
      # .claude/ as untrusted and restores it from a trusted ref, which
      # would silently discard agent files placed inside the repo. The
      # Claude Code SDK loads user + project + local settings sources, so
      # user-level agents are still picked up without touching repo content.
      - name: Install pipeline agents into this run
        run: |
          mkdir -p ~/.claude/agents
          cp .rn-pipeline/agents/*.md ~/.claude/agents/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Load orchestrator prompt
        id: load_prompt
        run: |
          {
            echo 'prompt<<RN_PIPELINE_PROMPT_EOF'
            cat .rn-pipeline/prompts/orchestrator.md
            echo 'RN_PIPELINE_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run rn-review-pipeline
        uses: anthropics/claude-code-action@v1
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PRIOR_BOT_COMMIT: ${{ steps.prior_commit.outputs.exists }}
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.load_prompt.outputs.prompt }}
          show_full_output: true
          allowed_bots: claude[bot]
          claude_args: |
            --model claude-sonnet-5
            --allowedTools Edit,Read,Write,Bash,Task,Grep,Glob

      # Loop-safety guarantee #2, enforced: this step is the ONLY thing that
      # commits/pushes on behalf of the pipeline, and it is skipped outright
      # whenever a prior pipeline commit already exists on this PR — no
      # matter what the agent wrote to disk above. At most one bot push per
      # PR, by construction, not by the agent's cooperation.
      - name: Commit and push pipeline changes
        if: steps.prior_commit.outputs.exists != 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Exclude every path claude-code-action itself manages/restores as
          # "untrusted PR head" content (.claude, CLAUDE.md, CLAUDE.local.md,
          # .mcp.json, .claude.json, .gitmodules, .ripgreprc, .husky — it
          # moves/removes these during its own setup, which git sees as
          # deletions; committing those would delete real project files),
          # plus our own workflow-internal paths: .rn-pipeline (the checked-
          # out rn-review-pipeline clone) and .rn-review-verdict.json (read
          # by the next step, must stay on disk but not be committed).
          EXCLUDES=(
            ':!.rn-pipeline' ':!.rn-review-verdict.json'
            ':!.claude' ':!CLAUDE.md' ':!CLAUDE.local.md'
            ':!.mcp.json' ':!.claude.json' ':!.gitmodules'
            ':!.ripgreprc' ':!.husky'
          )
          if [ -n "$(git status --porcelain -- . "${EXCLUDES[@]}")" ]; then
            git config user.name "rn-review-pipeline"
            git config user.email "rn-review-pipeline@users.noreply.github.com"
            # claude-code-action revokes its own installation token as soon as
            # it finishes (its post-step runs before this one) — re-authenticate
            # with the still-valid workflow GITHUB_TOKEN rather than relying on
            # whatever git credential state it left behind.
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            git add -A -- . "${EXCLUDES[@]}"
            git commit -m "rn-review-pipeline: add/update tests for this PR"
            git push origin HEAD:refs/heads/$HEAD_REF
          fi

      - name: Read verdict
        id: verdict
        run: |
          if [ -f .rn-review-verdict.json ]; then
            pass=$(node -pe "require('./.rn-review-verdict.json').pass" 2>/dev/null || echo false)
          else
            pass=false
          fi
          echo "pass=$pass" >> "$GITHUB_OUTPUT"
          echo "Verdict: pass=$pass"

      # Branch protection should require THIS status, not the workflow's own
      # check-suite: when the commit/push step above adds a new commit, that
      # push may not reliably re-trigger a fresh workflow run for the new SHA
      # (GitHub does not always fire a new run for a GITHUB_TOKEN-authored
      # push, precisely to avoid recursive triggering) — so nothing would
      # ever report against the PR's actual final head. Posting a status for
      # HEAD here, from the same run that already did the verification,
      # covers that SHA unconditionally, whether or not a push happened.
      - name: Report commit status for current HEAD
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          state="success"
          desc="rn-review-pipeline: review + tests passed"
          if [ "${{ steps.verdict.outputs.pass }}" != "true" ]; then
            state="failure"
            desc="rn-review-pipeline: verdict failing — see PR comment"
          fi
          gh api "repos/${{ github.repository }}/statuses/$sha" \
            -f state="$state" \
            -f context="rn-review-pipeline" \
            -f description="$desc" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null

      - name: Enforce verdict
        run: |
          if [ "${{ steps.verdict.outputs.pass }}" != "true" ]; then
            echo "::error::rn-review-pipeline verdict is failing — see PR comment for details."
            exit 1
          fi
